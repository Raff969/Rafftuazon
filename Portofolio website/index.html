<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | Xiao Raff</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#0a0a12 0%,#05070f 40%,#000000 75%),
        linear-gradient(180deg,#000000,#020617);
    color:#fff;
    overflow-x:hidden;
}

/* BACKGROUND DEPTH (SOFT BLUE AMBIENT) */
body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 25%,rgba(70,110,255,.14),transparent 42%),
        radial-gradient(circle at 80% 70%,rgba(40,80,200,.18),transparent 46%);
    animation:bgPulse 16s ease-in-out infinite;
    z-index:-1;
}

@keyframes bgPulse{
    0%,100%{opacity:.55}
    50%{opacity:1}
}

/* HERO */
.hero{
    min-height:100vh;
    padding:0 10%;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:90px;
}

/* GLASS CARD */
.hero-content{
    background:rgba(255,255,255,.035);
    backdrop-filter:blur(22px);
    border-radius:32px;
    padding:54px;
    border:1px solid rgba(120,150,255,.14);
    box-shadow:
        0 40px 120px rgba(0,0,0,.85),
        inset 0 0 0 rgba(255,255,255,.04);
    transition:.45s ease;
}

.hero-content:hover{
    transform:translateY(-6px);
}

/* TITLE */
.hero h1{
    font-size:clamp(42px,5vw,62px);
    line-height:1.15;
    margin-bottom:22px;
    font-weight:800;
}

.hero h1 span{
    background:linear-gradient(270deg,#3f6cff,#9db9ff,#2f4dcc);
    background-size:500% 500%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientMove 8s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* TEXT */
.hero p{
    color:#c7d2fe;
    font-size:17px;
    line-height:1.9;
    max-width:520px;
    margin-bottom:34px;
}

/* STATS */
.stats{
    display:flex;
    gap:26px;
    margin-bottom:44px;
}

.stat{
    font-size:14px;
    color:#9fb4ff;
    opacity:.9;
}

/* BUTTONS */
.actions{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
}

/* PRIMARY */
.actions a.primary{
    padding:15px 34px;
    border-radius:999px;
    background:linear-gradient(135deg,#3f6cff,#6f9dff);
    color:#020617;
    font-weight:800;
    font-size:15px;
    text-decoration:none;
    box-shadow:0 0 45px rgba(80,120,255,.6);
    transition:.4s ease;
}

.actions a.primary:hover{
    transform:translateY(-6px) scale(1.05);
    box-shadow:0 0 85px rgba(120,160,255,.9);
}

/* SECONDARY */
.actions a.secondary{
    padding:14px 28px;
    border-radius:999px;
    background:transparent;
    border:1px solid rgba(120,150,255,.5);
    color:#b7c9ff;
    font-weight:600;
    font-size:14px;
    text-decoration:none;
    transition:.35s ease;
}

.actions a.secondary:hover{
    background:rgba(120,150,255,.12);
    transform:translateY(-4px);
}

/* IMAGE */
.hero-image{
    display:flex;
    justify-content:center;
}

/* FRAME */
.hero-image .frame{
    padding:18px;
    border-radius:50%;
    background:linear-gradient(135deg,#2a3d7a,#5f8dff);
    box-shadow:
        0 0 45px rgba(80,120,255,.6),
        0 0 120px rgba(80,120,255,.4);
    animation:glowPulse 4s ease-in-out infinite;
}

@keyframes glowPulse{
    0%,100%{
        box-shadow:
            0 0 45px rgba(80,120,255,.55),
            0 0 120px rgba(80,120,255,.4);
    }
    50%{
        box-shadow:
            0 0 80px rgba(120,160,255,.85),
            0 0 160px rgba(120,160,255,.6);
    }
}

/* IMAGE CLEAN */
.hero-image img{
    width:100%;
    max-width:360px;
    border-radius:50%;
    background:transparent;
    display:block;
    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-16px)}
    100%{transform:translateY(0)}
}

/* MOBILE */
@media(max-width:900px){
    .hero{
        grid-template-columns:1fr;
        padding-top:90px;
        text-align:center;
    }

    .hero-content{padding:40px;}

    .stats{
        justify-content:center;
        flex-wrap:wrap;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .actions{justify-content:center;}

    .hero-image{margin-top:60px;}
}
</style>
</head>

<body>

<section class="hero">

    <div class="hero-content">
        <h1>Welcome.<br>I'm <span>Xiao Raff</span></h1>

        <p>
            Creative Web & UI Designer crafting modern, cinematic,
            and immersive digital experiences inspired by dark aesthetics
            and visual storytelling.
        </p>

        <div class="stats">
            <div class="stat">🎯 20+ Projects</div>
            <div class="stat">🧠 UI / Web / Motion</div>
            <div class="stat">🔥 Dark Cinematic Style</div>
        </div>

        <div class="actions">
            <a href="portfolio.html" class="primary">🚀 Enter Portfolio</a>
            <a href="portfolio.html#projects" class="secondary">📂 View Projects</a>
            <a href="donghua.html" class="secondary">🐉 Donghua</a>
        </div>
    </div>

    <div class="hero-image">
        <div class="frame">
            <img src="assets/image.png" alt="Profile">
        </div>
    </div>

</section>

</body>
</html>
