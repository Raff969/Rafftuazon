<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donghua | RafDev</title>

<style>
/* ================= COLOR SYSTEM ================= */
:root{
    --primary:#7aa2ff;
    --secondary:#4f6cff;
    --accent:#9db4ff;

    --bg-dark:#05070f;
    --bg-mid:#0b1230;
    --bg-light:#16215a;

    --glass:rgba(120,150,255,.08);
    --border:rgba(120,150,255,.25);
    --text-soft:#cfd8ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* ================= BACKGROUND ================= */
body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at top, var(--bg-light), transparent 55%),
        radial-gradient(circle at bottom right, #0a0f2a, transparent 60%),
        linear-gradient(120deg,var(--bg-dark),var(--bg-mid),#03040a);
    background-size:300% 300%;
    animation:bgMove 18s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* ================= DETAIL ================= */
.donghua{
    min-height:100vh;
    padding:90px 10% 50px;
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:70px;
    align-items:center;
}

.poster{
    display:flex;
    justify-content:center;
}

.poster img{
    width:100%;
    max-width:360px;
    border-radius:26px;
    box-shadow:
        0 40px 120px rgba(90,120,255,.55),
        0 0 0 1px rgba(120,150,255,.25);
    transition:.5s ease;
}

.poster img:hover{
    transform:scale(1.05) rotate(-1deg);
}

/* ================= INFO ================= */
.info{
    backdrop-filter:blur(14px);
}

.info h1{
    font-size:clamp(34px,4vw,46px);
    margin-bottom:16px;
    background:linear-gradient(
        270deg,
        var(--primary),
        #ffffff,
        var(--secondary),
        var(--accent)
    );
    background-size:400% 400%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleGradient 4s ease infinite;
}

@keyframes titleGradient{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.meta{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.meta span{
    padding:6px 16px;
    border-radius:999px;
    background:linear-gradient(
        135deg,
        rgba(90,120,255,.35),
        rgba(40,60,160,.25)
    );
    border:1px solid var(--border);
    font-size:13px;
    color:#eef1ff;
    backdrop-filter:blur(6px);
}

.info p{
    color:var(--text-soft);
    line-height:1.9;
    font-size:16px;
    margin-bottom:40px;
    max-width:640px;
}

/* ================= BUTTON ================= */
.actions{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
}

.actions a{
    padding:14px 30px;
    border-radius:999px;
    background:linear-gradient(135deg,var(--secondary),var(--primary));
    color:#05070f;
    font-weight:700;
    font-size:15px;
    text-decoration:none;
    transition:.35s ease;
    box-shadow:0 12px 35px rgba(90,120,255,.55);
}

.actions a.secondary{
    background:transparent;
    border:1px solid var(--secondary);
    color:var(--accent);
}

.actions a:hover{
    transform:translateY(-4px);
    box-shadow:0 22px 55px rgba(120,150,255,.7);
}

/* ================= GRID ================= */
.more{
    padding:60px 10% 120px;
}

.more h2{
    font-size:clamp(26px,3vw,34px);
    margin-bottom:36px;
    background:linear-gradient(270deg,var(--primary),#fff,var(--secondary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:34px;
}

.card{
    cursor:pointer;
    background:linear-gradient(
        160deg,
        rgba(20,30,90,.45),
        rgba(10,15,45,.85)
    );
    border:1px solid var(--border);
    border-radius:26px;
    padding:16px;
    text-align:center;
    transition:.45s ease;
    backdrop-filter:blur(10px);
}

.card img{
    width:100%;
    border-radius:18px;
    margin-bottom:14px;
    transition:.4s ease;
}

.card h3{
    font-size:15px;
    color:#eef1ff;
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 30px 90px rgba(90,120,255,.6);
}

.card:hover img{
    transform:scale(1.05);
}

/* ================= MOBILE ================= */
@media(max-width:900px){
    .donghua{
        grid-template-columns:1fr;
        text-align:center;
    }

    .info p{
        margin-left:auto;
        margin-right:auto;
    }

    .actions{
        justify-content:center;
    }
}
</style>
</head>

<body>

<section class="donghua">
    <div class="poster">
        <img id="mainPoster" src="assets/poster.jpg">
    </div>

    <div class="info">
        <h1 id="title">Donghua</h1>

        <div class="meta" id="meta">
            <span>Fantasy</span>
            <span>Action</span>
            <span>Romance</span>
            <span>Survival</span>
        </div>

        <p id="desc">
            Donghua adalah animasi asal Tiongkok (China) dengan gaya visual sinematik,
            dunia kultivasi, dan cerita epik.
        </p>

        <div class="actions">
            <a href="index.html">🏠 Home</a>
            <a href="portfolio.html" class="secondary">📁 Portfolio</a>
        </div>
    </div>
</section>

<section class="more">
    <h2>Other Favorite Donghua</h2>

    <div class="grid">
        <div class="card" onclick="showDonghua('Soul Land')">
            <img src="assets/Soulland.jpg">
            <h3>Soul Land</h3>
        </div>
        <div class="card" onclick="showDonghua('BTTH')">
            <img src="assets/Xiao.jpg">
            <h3>Battle Through The Heavens</h3>
        </div>
        <div class="card" onclick="showDonghua('Kings Avatar')">
            <img src="assets/TGR.jpg">
            <h3>The Great Ruler</h3>
        </div>
        <div class="card" onclick="showDonghua('Perfect World')">
            <img src="assets/PF.jpg">
            <h3>Perfect World</h3>
        </div>
        <div class="card" onclick="showDonghua('Swallowed Star')">
            <img src="assets/Swallowed Star.jpg">
            <h3>Swallowed Star</h3>
        </div>
        <div class="card" onclick="showDonghua('Martial Universe')">
            <img src="assets/Lin.jpg">
            <h3>Martial Universe</h3>
        </div>
    </div>
</section>

<script>
const data = {
    "Soul Land":{
        img:"assets/soulland.jpg",
        title:"Soul Land",
        meta:["Fantasy","Action","Cultivation","2018"],
        desc:"Soul Land menceritakan perjalanan Tang San di dunia Douluo Continent, di mana kekuatan ditentukan oleh roh bela diri dan tingkat kultivasi. Tang San yang awalnya dianggap lemah karena memiliki roh tanaman justru berkembang menjadi sosok luar biasa melalui kecerdasan, disiplin, dan tekad yang kuat. Bersama Shrek Seven Devils, ia menghadapi berbagai ujian berat, pertarungan antar sekte, konflik kekaisaran, serta ancaman dari kekuatan gelap yang ingin menguasai benua. Seiring cerita berjalan, fokus film ini tidak hanya pada pertarungan, tetapi juga pada persahabatan, pengorbanan, cinta, dan pilihan sulit yang harus dihadapi Tang San dalam melindungi orang-orang yang ia sayangi dan menjaga keseimbangan dunia Douluo."
    },
    "BTTH":{
        img:"assets/Xiao.jpg",
        title:"Battle Through The Heavens",
        meta:["Action","Martial Arts","Fantasy","2017"],
        desc:"Battle Through the Heavens (BTTH) menceritakan kisah Xiao Yan, seorang jenius muda yang tiba-tiba kehilangan seluruh bakat kultivasinya dan menjadi bahan ejekan banyak orang. Dalam keterpurukan, ia menemukan kembali jalannya melalui latihan keras dan bimbingan seorang guru misterius di dalam cincin yang ia kenakan. Perjalanan Xiao Yan dipenuhi pertarungan sengit, persaingan antar klan, serta konflik besar antar sekte dan kekuatan kuat di dunia Dou Qi. Seiring kekuatannya bangkit, cerita berfokus pada perjuangan Xiao Yan untuk membuktikan dirinya, melindungi orang-orang terdekat, dan menantang batas kemampuannya di dunia yang kejam namun penuh ambisi dan kehormatan."
    },
    "Kings Avatar":{
        img:"assets/TGR.jpg",
        title:"The Great Ruler",
        meta:["E-Sport","Action","Drama","2017"],
        desc:"The Great Ruler (TGR) menceritakan perjalanan Mu Chen, seorang pemuda berbakat yang berasal dari wilayah kecil namun memiliki potensi luar biasa. Ia memasuki dunia luas yang dipenuhi berbagai ras, sekte, dan penguasa kuat yang saling bersaing untuk mencapai puncak kekuatan. Dalam perjalanannya, Mu Chen menghadapi ujian hidup dan mati, pertarungan sengit, serta intrik antar kekuatan besar, sambil terus mengasah kekuatan spiritual dan teknik kultivasinya. Cerita ini berfokus pada pertumbuhan Mu Chen dari seorang pemuda ambisius menjadi sosok penguasa sejati, dengan tema tentang tekad, tanggung jawab, persahabatan, dan perjuangan untuk melindungi dunia dari ancaman kehancuran."
    },
    "Perfect World":{
        img:"assets/PF.jpg",
        title:"Perfect World",
        meta:["Fantasy","Action","Cultivation","2021"],
        desc:"Perfect World (PF) mengisahkan perjalanan Shi Hao, seorang anak jenius yang tumbuh di dunia penuh makhluk purba, klan kuat, dan hukum rimba yang kejam. Cerita berfokus pada perjuangannya bertahan hidup, melindungi orang-orang terdekatnya, dan menembus batas kekuatan di dunia yang dipenuhi pertarungan tanpa ampun. Dengan bakat luar biasa dan tekad yang kuat, Shi Hao terus menghadapi musuh yang jauh lebih kuat, rahasia kuno, serta konflik besar antar kekuatan dunia. Donghua ini menonjolkan perkembangan karakter yang intens, pertarungan epik, dan atmosfer dunia yang luas serta brutal, menggambarkan perjuangan menuju puncak kekuatan di dunia yang tidak memberi belas kasihan."
    },
    "Swallowed Star":{
        img:"assets/Swallowed Star.jpg",
        title:"Swallowed Star",
        meta:["Sci-Fi","Action","Future","2020"],
        desc:"Swallowed Star menceritakan kisah Luo Feng, seorang pemuda yang hidup di dunia pasca-apokaliptik di mana umat manusia terancam oleh monster-monster mematikan. Dalam kondisi penuh bahaya, Luo Feng berjuang untuk melindungi keluarganya sekaligus memperkuat dirinya melalui latihan ekstrem, pertempuran hidup dan mati, serta eksplorasi dunia yang semakin luas. Cerita ini menyoroti perjuangan manusia melawan kepunahan, perkembangan kekuatan pribadi, dan ambisi untuk menembus batas kemanusiaan. Dengan perpaduan aksi intens, teknologi futuristik, dan skala konflik kosmik, Swallowed Star menghadirkan perjalanan epik dari seorang pejuang biasa menuju sosok yang mampu menghadapi ancaman alam semesta."
    },
    "Martial Universe":{
        img:"assets/Lin.jpg",
        title:"Martial Universe",
        meta:["Martial Arts","Fantasy","Adventure","2018"],
        desc:"Martial Universe mengisahkan perjalanan Lin Dong, seorang pemuda dari keluarga sederhana yang hidup di dunia kultivasi penuh persaingan dan kekuatan brutal. Cerita berfokus pada perjuangannya bangkit dari posisi lemah, menghadapi klan-klan kuat, serta bertahan dalam konflik yang semakin besar dan berbahaya. Dengan tekad yang kuat dan kecerdikan dalam bertarung, Lin Dong terus menembus batas kekuatannya, menghadapi musuh-musuh tangguh, dan terlibat dalam pertarungan besar yang menentukan keseimbangan dunia. Donghua ini menonjolkan perkembangan karakter yang konsisten, pertarungan epik, serta tema tentang kegigihan, pengorbanan, dan ambisi untuk mencapai puncak kekuatan."
    }
}

function showDonghua(name){
    const d = data[name]
    document.getElementById("mainPoster").src = d.img
    document.getElementById("title").innerText = d.title
    document.getElementById("desc").innerText = d.desc

    const metaBox = document.getElementById("meta")
    metaBox.innerHTML = ""
    d.meta.forEach(m=>{
        const span = document.createElement("span")
        span.innerText = m
        metaBox.appendChild(span)
    })

    window.scrollTo({top:0, behavior:'smooth'})
}
</script>

</body>
</html>
